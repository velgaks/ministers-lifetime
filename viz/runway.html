<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналіз каденцій міністрів</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a id="sheet-link" class="ctl sheetlink" href="index.html"></a>
      <button id="lang-btn" class="ctl" type="button">EN</button>
      <button id="theme-btn" class="ctl" type="button">Темна</button>
    </div>
    <h1 id="title"></h1>
    <p id="subtitle" class="subtitle"></p>
  </header>

  <section id="split" class="tiles"></section>

  <section class="card">
    <h2 id="chart-title"></h2>
    <p id="chart-cap" class="cap"></p>
    <div class="scrollx"><div id="runway-host"></div></div>
    <div id="runway-legend" class="legend"></div>
  </section>

  <section class="card">
    <h2 id="acting-title"></h2>
    <p id="acting-cap" class="cap"></p>
    <div class="scrollx"><div id="acting-host"></div></div>
  </section>

  <section class="card">
    <div class="cardctl">
      <label class="chk"><input type="checkbox" class="excl-chk"> <span class="excl-label"></span></label>
    </div>
    <h2 id="trend-title"></h2>
    <p id="trend-cap" class="cap"></p>
    <div class="scrollx"><div id="scatter-host"></div></div>
    <div id="trend-legend" class="legend"></div>
  </section>

  <section class="card">
    <div class="cardctl">
      <label class="chk"><input type="checkbox" class="excl-chk"> <span class="excl-label"></span></label>
    </div>
    <h2 id="era-title"></h2>
    <p id="era-cap" class="cap"></p>
    <div class="scrollx"><div id="erabars-host"></div></div>
  </section>

  <footer>
    <p id="footer-note" class="fnote"></p>
    <p class="fcredit"><span id="footer-credit"></span>
      <a id="footer-repo" href="https://github.com/velgaks/ministers-lifetime" target="_blank" rel="noopener"></a></p>
  </footer>
</div>
<div id="tooltip" role="tooltip"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="runway.js"></script>
</body>
</html>
